{% extends 'inventario/base.html' %}
{% block contenido %}
<div class="top">
  <h2>Categorias</h2>
  <a class="btn" href="{% url 'inventario:categoria_crear' %}">+ Nueva categoria</a>
</div>
{% if not categorias %}
  <p>No hay categorias todavia.</p>
{% else %}
<table>
  <tr><th>Nombre</th><th>Descripcion</th></tr>
  {% for c in categorias %}
  <tr><td>{{ c.nombre }}</td><td>{{ c.descripcion }}</td></tr>
  {% endfor %}
</table>
{% endif %}
{% endblock %}
